# sdxl_cityscapes_drift.yaml trained on 10 randomly drawn images instead of the
# whole split (~1,000 epochs at 10k steps, the regime of the paper's few-shot
# setting). Every arm trains on the same 10 images, recorded in
# runs/sdxl_cityscapes_fewshot10/training_subset.json.
#
# The subset applies to the training loop only: the drift samples, the generation
# prompts' class names and the CMMD reference keep reading the full data.
#
# This config backs the three baselines of the report that do not depend on CA
# (E_random, E_all, control_base). They come from the 2026-11-02 campaign, whose
# drift snapshots still read real frames; since 2026-11-07 the drift x0 is
# self-generated (measure.drift_source, inherited). The CA-selected arms use
# sdxl_cityscapes_selfgen_fewshot10.yaml, with selections from runs/ca_selfgen.
#
# `name` is its own so nothing lands in runs/sdxl_cityscapes/.
_base_: sdxl_cityscapes_drift.yaml

name: sdxl_cityscapes_fewshot10

train:
  subset_size: 10
  subset_seed: 0
